<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoe Fashion - Sprint 0 Scaffold</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Sprint 0 Scaffold</p>
        <h1>Zoe Fashion</h1>
      </div>
      <input id="global-search" type="search" placeholder="Search products, brands, tags..." />
    </header>

    <section id="view" class="view" aria-live="polite"></section>

    <nav class="tabbar" aria-label="Primary navigation">
      <button data-tab="home" class="tab is-active">Home</button>
      <button data-tab="search" class="tab">Search</button>
      <button data-tab="rank" class="tab">Rank</button>
      <button data-tab="profile" class="tab">Profile</button>
    </nav>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
